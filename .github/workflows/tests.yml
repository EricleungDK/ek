name: tests

# ekit's own suite (the same gate release.yml runs) on every PR, so a test that only fails on GitHub's runner shows up here and
# not first in release.yml (v0.2.5's release run was the suite's first run on a runner).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tests/run.sh
        run: bash tests/run.sh
