name: release

# A release tag vX.Y.Z moves the floating major tag vX (v0 now) after ekit's tests pass.
# Callers pin `EricleungDK/ekit/.github/workflows/mech-review.yml@v0`, so they get each release
# without a bump PR in their repo. The plugin's own version (.claude-plugin/plugin.json) is the
# source of truth: the tag must match it. See docs/mech-review-ci.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-major-tag
  cancel-in-progress: false

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag matches plugin.json
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != plugin.json v$version"; exit 1; }
      - name: ekit tests
        run: bash tests/run.sh
      - name: move the major tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/move-major-tag.sh "$GITHUB_REF_NAME"
