name: mech-review

# Reusable. Callers pin an ek tag:
#   uses: EricleungDK/ek/.github/workflows/mech-review.yml@v0.2.1
# The ek scripts run at the SAME ref the caller pinned: job.workflow_sha / job.workflow_repository
# are the called workflow file's commit and repo, so the guard, red-first, mutants and the poster are checked out from there.

on:
  workflow_call:
    inputs:
      stack:
        description: "language adapter: rust (cargo test, cargo-mutants), python (pytest, mutmut 3.8.1 in a venv) or ts (vitest or jest from package.json, Stryker 10.0.0; node 22)"
        type: string
        default: rust
      test-paths:
        description: "test file globs, one per line (** any depth, * one segment)"
        type: string
        default: |
          tests/**
      protected-paths:
        description: "globs, one per line; any change under them is a needs-human fail"
        type: string
        default: |
          .github/**
      agent-branch-prefix:
        description: "R1 red-first runs only on head branches with this prefix"
        type: string
        default: "agent/"
      mutation-budget:
        description: "R3 budget in minutes per mutants shard (cargo-mutants on the diff); a budget hit is partial, not a failure"
        type: string
        default: "10"
      extra-apt-packages:
        description: "apt packages (space-separated) installed before the red-first job runs its tests"
        type: string
        default: ""
      project-dir:
        description: "crate dir under the repo root (default .): R1, R4 and R3 run there; test-paths and protected-paths stay repo-root globs"
        type: string
        default: "."
      setup-command:
        description: "shell command (run with bash) before the tests in red-first and mutants, after extra-apt-packages; a failure stops that job. Set it in the caller's workflow file only (trusted)"
        type: string
        default: ""
      mutant-timeout:
        description: "R3 per-mutant timeout in seconds (cargo-mutants --timeout), or empty for auto: no timeout flag, so cargo-mutants sets it from the baseline and the baseline runs unlimited. A set value also caps the baseline tests: a baseline timeout is n/a, not a fail"
        type: string
        default: ""
      rust-toolchain:
        description: "Rust toolchain for the rust stack in red-first and mutants (dtolnay/rust-toolchain toolchain input): stable, or a pin such as 1.96.0"
        type: string
        default: "stable"

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    name: mech-review guard (R2)
    runs-on: ubuntu-latest
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ek engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ek
          persist-credentials: false
      - name: R2 guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ inputs.stack }}
          TEST_PATHS: ${{ inputs.test-paths }}
          PROTECTED_PATHS: ${{ inputs.protected-paths }}
        run: |
          set -uo pipefail
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK")
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--protected-paths "$g"); fi
          done <<< "$PROTECTED_PATHS"
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ek/scripts/mech-review.py" r2 "${args[@]}" > mech-review.json 2> mech-review.err || rc=$?
          cat mech-review.err >&2
          # exit 1 = fail entries: a result, saved and reported. exit 2+ = usage or git error: no result.
          if [ "$rc" -gt 1 ]; then
            rm -f mech-review.json
            echo "::error::mech-review engine exit $rc (usage or git error): no result"
            exit "$rc"
          fi
      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-review-json
          path: mech-review.json
          if-no-files-found: ignore
          overwrite: true

  red-first:
    name: mech-review red-first (R1, R4)
    runs-on: ubuntu-latest
    # runs PR code (cargo test): read-only token, so a PR test cannot edit the comment or PR content
    permissions:
      contents: read
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ek engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ek
          persist-credentials: false
      - name: Rust toolchain
        if: inputs.stack == 'rust'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Python toolchain
        if: inputs.stack == 'python'
        env:
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          set -eu
          # project-dir stays under the repo root; a value that escapes it is a hard stop, not a silent path
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          # runner python in a venv (the runner's system python is externally managed); pytest pinned; the requirements
          # files in the project dir install the test deps. The project itself is not installed here: setup-command does
          # that (it runs after this step, with the venv on PATH).
          python3 -m venv "$RUNNER_TEMP/py-venv"
          "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet "pytest==9.2.0"
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          for f in requirements*.txt; do
            [ -e "$f" ] || continue
            "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet -r "$f"
          done
          echo "$RUNNER_TEMP/py-venv/bin" >> "$GITHUB_PATH"
      - name: TypeScript toolchain
        if: inputs.stack == 'ts'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: TypeScript dependencies
        # lockfile-aware: npm ci for package-lock.json, the repo's own pnpm or yarn (pinned) for theirs. The install runs
        # the dependencies' install scripts, like the test code does: the job's token is read-only. No lockfile is a stop.
        if: inputs.stack == 'ts'
        env:
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          set -eu
          # project-dir stays under the repo root; a value that escapes it is a hard stop, not a silent path
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f pnpm-lock.yaml ]; then
            npx --yes pnpm@10.34.6 install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            npx --yes yarn@1.22.22 install --frozen-lockfile
          else
            echo "::error::no lockfile (package-lock.json, pnpm-lock.yaml or yarn.lock) in $PROJECT_DIR: the install must be reproducible"
            exit 2
          fi
      - name: extra apt packages
        if: inputs.extra-apt-packages != ''
        env:
          EXTRA_APT: ${{ inputs.extra-apt-packages }}
        run: |
          set -eu
          read -ra pkgs <<< "$EXTRA_APT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${pkgs[@]}"
      - name: setup command
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        shell: bash
        run: bash -c "$SETUP_COMMAND"
      - name: R1 red-first, R4 determinism
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          AGENT_PREFIX: ${{ inputs.agent-branch-prefix }}
          STACK: ${{ inputs.stack }}
          TEST_PATHS: ${{ inputs.test-paths }}
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          set -uo pipefail
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK"
                --head-branch "$HEAD_REF" --agent-prefix "$AGENT_PREFIX" --project-dir "$PROJECT_DIR")
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ek/scripts/mech-review.py" red "${args[@]}" > mech-review-red.json 2> mech-review-red.err || rc=$?
          cat mech-review-red.err >&2
          # exit 1 = fail entries: a result, saved and reported. exit 2+ = usage or git error: no result.
          if [ "$rc" -gt 1 ]; then
            rm -f mech-review-red.json
            echo "::error::mech-review red-first exit $rc (usage or git error): no result"
            exit "$rc"
          fi
      - name: upload red-first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-review-red-json
          path: mech-review-red.json
          if-no-files-found: ignore
          overwrite: true

  plan:
    name: mech-review plan (R3 shards)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ek engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ek
          persist-credentials: false
      - name: R3 plan (does the mutants job run, its shard matrix)
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ inputs.stack }}
          TEST_PATHS: ${{ inputs.test-paths }}
          MUTATION_SHARDS: "4"
        run: |
          set -eu
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK" --shards "$MUTATION_SHARDS")
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          python3 -I "$GITHUB_WORKSPACE/ek/scripts/mech-review.py" plan "${args[@]}" > mech-plan.json
          python3 -I - "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          p = json.load(open("mech-plan.json"))
          with open(sys.argv[1], "a") as out:
              out.write(f"run={str(p['run']).lower()}\n")
              out.write(f"count={p['count']}\n")
              out.write(f"shards={json.dumps(p['shards'])}\n")
          PY

  mutants:
    name: mech-review mutants (R3 shard ${{ matrix.shard }})
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # runs PR code (cargo mutants runs its tests): read-only token, same as red-first
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ek engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ek
          persist-credentials: false
      - name: Rust toolchain
        if: inputs.stack == 'rust'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Python toolchain
        if: inputs.stack == 'python'
        env:
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          set -eu
          # project-dir stays under the repo root; a value that escapes it is a hard stop, not a silent path
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          # runner python in a venv (the runner's system python is externally managed); pytest and mutmut pinned; the
          # requirements files in the project dir install the test deps. The project itself is not installed here:
          # setup-command does that (it runs after this step, with the venv on PATH).
          python3 -m venv "$RUNNER_TEMP/py-venv"
          "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet "pytest==9.2.0" "mutmut==3.8.1"
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          for f in requirements*.txt; do
            [ -e "$f" ] || continue
            "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet -r "$f"
          done
          echo "$RUNNER_TEMP/py-venv/bin" >> "$GITHUB_PATH"
      - name: TypeScript toolchain
        if: inputs.stack == 'ts'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: TypeScript dependencies
        # lockfile-aware: npm ci for package-lock.json, the repo's own pnpm or yarn (pinned) for theirs. The install runs
        # the dependencies' install scripts, like the test code does: the job's token is read-only. No lockfile is a stop.
        if: inputs.stack == 'ts'
        env:
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          set -eu
          # project-dir stays under the repo root; a value that escapes it is a hard stop, not a silent path
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f pnpm-lock.yaml ]; then
            npx --yes pnpm@10.34.6 install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            npx --yes yarn@1.22.22 install --frozen-lockfile
          else
            echo "::error::no lockfile (package-lock.json, pnpm-lock.yaml or yarn.lock) in $PROJECT_DIR: the install must be reproducible"
            exit 2
          fi
      - name: extra apt packages
        if: inputs.extra-apt-packages != ''
        env:
          EXTRA_APT: ${{ inputs.extra-apt-packages }}
        run: |
          set -eu
          read -ra pkgs <<< "$EXTRA_APT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${pkgs[@]}"
      - name: setup command
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        shell: bash
        run: bash -c "$SETUP_COMMAND"
      - name: Stryker (pinned)
        # isolated from the repo's node_modules: its own prefix in the runner temp dir. A failed install is not a stop:
        # the engine reports n/a (env) when the binary is missing. The test runner plugin is loaded from the project.
        if: inputs.stack == 'ts'
        continue-on-error: true
        run: |
          set -u
          npm install --prefix "$RUNNER_TEMP/stryker" --no-audit --no-fund --legacy-peer-deps "@stryker-mutator/core@10.0.0" "@stryker-mutator/jest-runner@10.0.0"
      - name: install cargo-mutants (pinned)
        # a failed install is not a stop: the engine reports n/a (env) when the tool is missing
        if: inputs.stack == 'rust'
        id: install
        continue-on-error: true
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: R3 mutation on the diff (shard)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ inputs.stack }}
          TEST_PATHS: ${{ inputs.test-paths }}
          MUTATION_BUDGET: ${{ inputs.mutation-budget }}
          MUTANT_TIMEOUT: ${{ inputs.mutant-timeout }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.plan.outputs.count }}
          PROJECT_DIR: ${{ inputs.project-dir }}
          STRYKER_BIN: ${{ runner.temp }}/stryker/node_modules/.bin/stryker
        run: |
          set -uo pipefail
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK"
                --shard "$SHARD/$SHARD_COUNT" --mutation-budget "$MUTATION_BUDGET" --project-dir "$PROJECT_DIR")
          if [ -n "$MUTANT_TIMEOUT" ]; then args+=(--mutant-timeout "$MUTANT_TIMEOUT"); fi
          if [ "$STACK" = "ts" ]; then args+=(--mutants-cmd "$STRYKER_BIN"); fi
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ek/scripts/mech-review.py" mutants "${args[@]}" > mech-review-mutants.json 2> mech-review-mutants.err || rc=$?
          cat mech-review-mutants.err >&2
          # exit 1 = fail entries: a result, saved and reported. exit 2+ = usage or git error: no result.
          if [ "$rc" -gt 1 ]; then
            rm -f mech-review-mutants.json
            echo "::error::mech-review mutants exit $rc (usage or git error): no result"
            exit "$rc"
          fi
      - name: upload mutants result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-review-mutants-${{ matrix.shard }}
          path: mech-review-mutants.json
          if-no-files-found: ignore
          overwrite: true

  report:
    name: mech-review report
    needs: [guard, red-first, plan, mutants]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ek comment poster checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ek
          persist-credentials: false
      - name: fetch guard result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mech-review-json
          path: r2-result
      - name: fetch red-first result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mech-review-red-json
          path: red-result
      - name: fetch mutants shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "mech-review-mutants-*"
          path: mutants-result
      - name: merge mutants shards (R3)
        if: ${{ needs.plan.outputs.run == 'true' || needs.plan.result != 'success' }}
        env:
          COUNT: ${{ needs.plan.outputs.count }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ inputs.stack }}
        run: |
          set -u
          # a missing shard file is a CI entry in the merge, never a silent pass
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK" --shards "${COUNT:-1}")
          for ((k = 0; k < ${COUNT:-1}; k++)); do
            f="mutants-result/mech-review-mutants-$k/mech-review-mutants.json"
            if [ -f "$f" ]; then args+=(--envelope "$k=$f"); fi
          done
          rc=0
          python3 -I ek/scripts/mech-review.py merge "${args[@]}" > mutants-merged.json 2> mutants-merged.err || rc=$?
          cat mutants-merged.err >&2
          if [ "$rc" -gt 1 ]; then
            rm -f mutants-merged.json
            echo "::error::mech-review merge exit $rc (usage error): no mutants result"
          fi
      - name: post or edit the sticky comment, set the check result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ needs.plan.outputs.run }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          extra=()
          if [ "$RUN" = "true" ] || [ "$PLAN_RESULT" != "success" ]; then
            extra+=(--envelope mutants=mutants-merged.json)
          fi
          python3 -I ek/scripts/mech-comment.py --pr "$PR_NUMBER" --head "$HEAD_SHA" \
            --envelope r2=r2-result/mech-review.json \
            --envelope red=red-result/mech-review-red.json \
            "${extra[@]}" \
            --reason "no JSON from the job (see its log)"
